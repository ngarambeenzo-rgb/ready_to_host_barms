<div class="page" id="page-bar-movements">
  <div class="page-header">
    <div>
      <div class="page-title">Stock Movements</div>
      <div class="page-sub">Complete history of all stock changes</div>
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn btn-ghost btn-sm" onclick="loadBarMovements('today')" id="bmFilter-today" style="border-color:var(--blue);color:var(--blue);font-weight:700">Today</button>
      <button class="btn btn-ghost btn-sm" onclick="loadBarMovements('week')" id="bmFilter-week">This Week</button>
      <button class="btn btn-ghost btn-sm" onclick="loadBarMovements('month')" id="bmFilter-month">This Month</button>
      <input type="date" class="form-input" id="bmPickDate" onchange="loadBarMovements('date')" style="padding:6px 10px;font-size:12px;width:140px"/>
    </div>
  </div>

  <!-- Type filter -->
  <div style="display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap">
    <button onclick="bmFilterType('all',this)" class="bm-type-btn active" style="background:var(--blue);color:#fff;border:none;border-radius:8px;padding:6px 14px;cursor:pointer;font-family:inherit;font-size:12px;font-weight:700">All</button>
    <button onclick="bmFilterType('sale',this)" class="bm-type-btn" style="background:var(--card);border:1px solid var(--border);border-radius:8px;padding:6px 14px;cursor:pointer;font-family:inherit;font-size:12px;color:var(--muted)">Sales</button>
    <button onclick="bmFilterType('purchase',this)" class="bm-type-btn" style="background:var(--card);border:1px solid var(--border);border-radius:8px;padding:6px 14px;cursor:pointer;font-family:inherit;font-size:12px;color:var(--muted)">Purchases</button>
    <button onclick="bmFilterType('breakage',this)" class="bm-type-btn" style="background:var(--card);border:1px solid var(--border);border-radius:8px;padding:6px 14px;cursor:pointer;font-family:inherit;font-size:12px;color:var(--muted)">Breakages</button>
  </div>

  <div style="background:var(--card);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;overflow-x:auto">
    <table style="width:100%;border-collapse:collapse;min-width:780px">
      <thead>
        <tr style="background:var(--bg);border-bottom:2px solid var(--border)">
          <th style="padding:12px 16px;text-align:left;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase">Date & Time</th>
          <th style="padding:12px 16px;text-align:left;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase">Item / Ingredient</th>
          <th style="padding:12px 16px;text-align:center;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase">Type</th>
          <th style="padding:12px 16px;text-align:center;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase">Qty Change</th>
          <th style="padding:12px 16px;text-align:right;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase">Purchase Cost</th>
          <th style="padding:12px 16px;text-align:left;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase">Reason / Order</th>
          <th style="padding:12px 16px;text-align:left;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase">Done By</th>
        </tr>
      </thead>
      <tbody id="bmMovementsBody">
        <tr><td colspan="7" style="padding:40px;text-align:center;color:var(--muted)"><div class="ui-loader"><span class="ul-mark"><i></i><i></i><i></i></span><span class="ul-text">Loading…</span></div></td></tr>
      </tbody>
    </table>
  </div>
</div>
