<div class="page" id="page-order">
  <!-- Back + Header -->
  <div class="page-header" style="margin-bottom:14px">
    <div style="display:flex;align-items:center;gap:12px">
      <button class="btn btn-ghost btn-sm" onclick="closeOrderPage()" style="padding:8px 12px">← Back</button>
      <div>
        <div class="page-title" id="orderPageTitle">Sales Order</div>
        <div class="page-sub" id="orderPageSub">Order details</div>
      </div>
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <span id="orderStatusBadge" style="display:inline-flex;align-items:center;padding:4px 12px;border-radius:20px;font-size:12px;font-weight:700;background:var(--blue-lt);color:var(--blue)">Open</span>
      <button class="btn btn-ghost btn-sm" onclick="holdOrder()">Hold</button>
      <button class="btn btn-green btn-sm" onclick="goToCheckout()" id="checkoutBtn" disabled>Checkout</button>
    </div>
  </div>

  <div style="display:grid;grid-template-columns:1fr 360px;gap:16px;height:calc(100vh - 180px);min-height:400px">

    <!-- LEFT: Products -->
    <div style="display:flex;flex-direction:column;gap:12px;overflow:hidden">
      <!-- Search + Category filter -->
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <input class="form-input" id="orderProductSearch" placeholder="Search product..." oninput="filterOrderProducts(this.value)" style="flex:1;min-width:160px"/>
        <select class="form-input" id="orderCategoryFilter" onchange="filterOrderProducts()" style="flex:0 0 140px">
          <option value="">All Categories</option>
        </select>
      </div>
      <!-- Product Grid -->
      <div id="orderProductGrid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;overflow-y:auto;padding-right:4px;flex:1"></div>
    </div>

    <!-- RIGHT: Current Order -->
    <div style="display:flex;flex-direction:column;background:var(--card);border-radius:var(--r);border:1px solid var(--border);overflow:hidden">
      <!-- Order header -->
      <div style="background:linear-gradient(135deg,var(--blue),var(--purple));padding:14px 16px">
        <div style="font-size:13px;font-weight:800;color:#fff" id="orderPanelTitle">Order</div>
        <div style="font-size:11px;color:rgba(255,255,255,.7);margin-top:2px" id="orderPanelSub"></div>
      </div>

      <!-- Note field -->
      <div style="padding:10px 14px;border-bottom:1px solid var(--border)">
        <input class="form-input" id="orderNote" placeholder="Order note (optional)..." style="font-size:12px;padding:7px 10px"/>
      </div>

      <!-- Items list -->
      <div id="orderItemsList" style="flex:1;overflow-y:auto;padding:10px 14px">
        <div style="text-align:center;padding:24px;color:var(--muted);font-size:13px">No items yet — tap a product to add</div>
      </div>

      <!-- Total -->
      <div style="padding:12px 16px;border-top:2px solid var(--border);background:var(--bg)">
        <div style="display:flex;justify-content:space-between;align-items:center">
          <span style="font-size:13px;font-weight:600;color:var(--muted)">TOTAL</span>
          <span style="font-size:22px;font-weight:900;color:var(--green);font-family:'DM Mono',monospace" id="orderTotal">RWF 0</span>
        </div>
        <div style="font-size:11px;color:var(--muted);margin-top:2px" id="orderItemCount">0 items</div>
      </div>
    </div>
  </div>

  <style>
    .order-product-card{background:var(--card);border:1.5px solid var(--border);border-radius:var(--r-sm);padding:12px 10px;cursor:pointer;text-align:center;transition:all .15s;user-select:none}
    .order-product-card:hover{border-color:var(--blue);background:var(--blue-lt);transform:translateY(-1px)}
    .order-product-card:active{transform:scale(.97)}
    .order-product-card.out-of-stock{opacity:.4;cursor:not-allowed}
    .order-item-row{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--border)}
    .order-item-row:last-child{border-bottom:none}
    .order-qty-btn{width:26px;height:26px;border-radius:6px;border:1.5px solid var(--border);background:var(--bg);cursor:pointer;font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
    .order-qty-btn:hover{background:var(--blue-lt);border-color:var(--blue);color:var(--blue)}
  </style>
</div>
