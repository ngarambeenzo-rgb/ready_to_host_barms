<div class="page" id="page-checkout">
  <div class="page-header" style="margin-bottom:14px">
    <div style="display:flex;align-items:center;gap:12px">
      <button class="btn btn-ghost btn-sm" onclick="closeCheckoutPage()" style="padding:8px 12px">← Back to Order</button>
      <div>
        <div class="page-title">Checkout</div>
        <div class="page-sub" id="checkoutPageSub">Finalize payment</div>
      </div>
    </div>
  </div>

  <div style="display:grid;grid-template-columns:1fr 380px;gap:16px">

    <!-- LEFT: Invoice Preview -->
    <div class="card" style="padding:0;overflow:hidden">
      <div style="background:linear-gradient(135deg,#1E3A8A,#2563EB);padding:18px 22px">
        <div style="font-size:11px;color:rgba(255,255,255,.6);text-transform:uppercase;letter-spacing:.1em">Invoice</div>
        <div style="font-size:18px;font-weight:800;color:#fff;margin-top:2px" id="checkoutInvoiceNum">INV-00001</div>
        <div style="font-size:11px;color:rgba(255,255,255,.6);margin-top:4px" id="checkoutInvoiceMeta"></div>
      </div>
      <div style="padding:18px">
        <!-- Items table -->
        <table style="width:100%;border-collapse:collapse;margin-bottom:16px">
          <thead>
            <tr style="border-bottom:2px solid var(--border)">
              <th style="text-align:left;padding:8px 4px;font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase">Product</th>
              <th style="text-align:center;padding:8px 4px;font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase">Qty</th>
              <th style="text-align:right;padding:8px 4px;font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase">Unit</th>
              <th style="text-align:right;padding:8px 4px;font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase">Total</th>
            </tr>
          </thead>
          <tbody id="checkoutItemsTable"></tbody>
        </table>
        <!-- Totals -->
        <div style="border-top:2px solid var(--border);padding-top:12px">
          <div style="display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-bottom:6px">
            <span>Subtotal</span>
            <span id="checkoutSubtotal" style="font-family:'DM Mono',monospace">RWF 0</span>
          </div>
          <div style="display:flex;justify-content:space-between;font-size:18px;font-weight:900;color:var(--green)">
            <span>TOTAL</span>
            <span id="checkoutTotal" style="font-family:'DM Mono',monospace">RWF 0</span>
          </div>
        </div>
        <!-- Note -->
        <div id="checkoutNoteRow" style="display:none;margin-top:12px;padding:10px 12px;background:var(--gold-lt);border-radius:var(--r-sm);font-size:12px;color:var(--text)">
          <span id="checkoutNoteText"></span>
        </div>
      </div>
    </div>

    <!-- RIGHT: Payment + Delivery -->
    <div style="display:flex;flex-direction:column;gap:14px">

      <!-- Payment Method -->
      <div class="card" style="padding:18px">
        <div style="font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:12px">Payment Method</div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px">
          <button class="checkout-pm-btn active" id="cpm_Cash" onclick="selectCheckoutPM('Cash',this)">Cash</button>
          <button class="checkout-pm-btn" id="cpm_MoMo" onclick="selectCheckoutPM('MoMo',this)">MoMo</button>
          <button class="checkout-pm-btn" id="cpm_Card" onclick="selectCheckoutPM('Card',this)">Card</button>
          <button class="checkout-pm-btn" id="cpm_Mixed" onclick="selectCheckoutPM('Mixed',this)">Mixed</button>
        </div>
        <!-- MoMo/Phone field -->
        <div id="checkoutPhoneRow">
          <label class="form-label" style="font-size:11px">Customer Phone (for SMS receipt)</label>
          <input type="tel" class="form-input" id="checkoutPhone" placeholder="e.g. 0788000000" style="font-size:13px"/>
        </div>
      </div>

      <!-- Receipt Delivery -->
      <div class="card" style="padding:18px">
        <div style="font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:12px">Receipt Delivery</div>
        <div style="display:flex;flex-direction:column;gap:8px">
          <label style="display:flex;align-items:center;gap:10px;cursor:pointer;padding:10px 12px;border-radius:var(--r-sm);border:1.5px solid var(--border);transition:border-color .15s" onclick="selectDelivery('print',this)">
            <input type="radio" name="receiptDelivery" value="print" checked style="accent-color:var(--blue)"/>
            <span style="font-size:13px;font-weight:600">Print Invoice</span>
          </label>
          <label style="display:flex;align-items:center;gap:10px;cursor:pointer;padding:10px 12px;border-radius:var(--r-sm);border:1.5px solid var(--border);transition:border-color .15s" onclick="selectDelivery('sms',this)">
            <input type="radio" name="receiptDelivery" value="sms" style="accent-color:var(--blue)"/>
            <span style="font-size:13px;font-weight:600">Send SMS</span>
          </label>
          <label style="display:flex;align-items:center;gap:10px;cursor:pointer;padding:10px 12px;border-radius:var(--r-sm);border:1.5px solid var(--border);transition:border-color .15s" onclick="selectDelivery('both',this)">
            <input type="radio" name="receiptDelivery" value="both" style="accent-color:var(--blue)"/>
            <span style="font-size:13px;font-weight:600">+ Print & SMS</span>
          </label>
        </div>
      </div>

      <!-- Pay Button -->
      <button class="btn btn-green" style="width:100%;justify-content:center;padding:16px;font-size:16px;font-weight:800" onclick="processCheckout()" id="payAndCloseBtn">
        Pay & Close — <span id="checkoutPayTotal">RWF 0</span>
      </button>

      <div style="font-size:11px;color:var(--muted);text-align:center;line-height:1.5">
        After payment: Table → Cleaning<br>Cashier marks Available when ready
      </div>
    </div>
  </div>

  <style>
    .checkout-pm-btn{background:var(--card);border:2px solid var(--border);border-radius:var(--r-sm);padding:12px 8px;cursor:pointer;font-family:inherit;font-size:13px;font-weight:700;color:var(--text);transition:all .15s}
    .checkout-pm-btn.active{border-color:var(--blue);background:var(--blue-lt);color:var(--blue)}
    .checkout-pm-btn:hover{border-color:var(--blue)}
  </style>
</div>
