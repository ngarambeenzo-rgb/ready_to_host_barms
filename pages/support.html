        <div class="page" id="page-support">
          <div class="page-header">
            <div>
              <div class="page-title">Help &amp; support</div>
              <div class="page-sub">Write to the IMS team about any problem or question. We reply by phone or email.</div>
            </div>
          </div>

          <div class="sup-grid">
            <section class="form-panel">
              <div class="form-panel-title">New message</div>
              <div class="form-group"><label class="form-label">What is it about?</label>
                <select class="form-input" id="supCategory">
                  <option value="problem">Something is not working</option>
                  <option value="question">Question</option>
                  <option value="licence">Licence or payment</option>
                  <option value="idea">Idea / new feature</option>
                  <option value="other">Other</option>
                </select></div>
              <div class="form-group"><label class="form-label">Subject</label>
                <input class="form-input" id="supSubject" maxlength="150" placeholder="e.g. Receipt does not print"/></div>
              <div class="form-group"><label class="form-label">Describe the issue</label>
                <textarea class="form-input" id="supMessage" rows="6" maxlength="5000" placeholder="What happened, on which page, and what you expected. The more detail, the faster we can help."></textarea></div>
              <div class="form-group"><label class="form-label">How can we reach you?</label>
                <input class="form-input" id="supContact" maxlength="150" placeholder="Phone number or email"/></div>
              <div class="sup-note"><i data-ic="info"></i><span>Your bar name, your name and the time are added automatically so we know who is writing.</span></div>
              <button class="btn btn-primary btn-block" id="supSendBtn" onclick="sendSupport()"><i data-ic="arrowright"></i>Send to IMS</button>
            </section>

            <section class="form-panel">
              <div class="form-panel-title">Your messages</div>
              <div id="supConfigNote"></div>
              <div id="supList">
                <div class="ui-loader"><span class="ul-mark"><i></i><i></i><i></i></span><span class="ul-text">Loading…</span></div>
              </div>
            </section>
          </div>
        </div>
