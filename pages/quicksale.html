        <div class="page" id="page-quicksale">
          <div class="grid-2">
            <div class="form-panel">
              <div class="form-panel-title"><span data-i18n="quickSaleTitle">Quick Sale — Add Items</span></div>
              <div class="form-row cols-2">
                <div class="form-group"><label class="form-label" data-i18n="product">Product</label><select
                    class="form-input" id="qsProduct"></select></div>
                <div class="form-group"><label class="form-label" data-i18n="qty">Quantity</label><input type="number"
                    class="form-input" id="qsQty" value="1" min="1" /></div>
              </div>
              <button class="btn btn-ghost" onclick="addQsItem()"
                style="width:100%;justify-content:center;margin-bottom:16px" data-i18n="addItemBtn">+ Add Item to
                Order</button>
              <div id="qsItems">
                <p style="text-align:center;color:var(--muted);font-size:13px;padding:20px 0" data-i18n="noItemsYet">No
                  items added yet</p>
              </div>
            </div>
            <div class="card" style="display:flex;flex-direction:column">
              <div class="card-title" style="margin-bottom:16px"><span data-i18n="orderSummary">Order Summary</span>
              </div>
              <div id="qsSummary" style="flex:1"></div>
              <hr class="divider" />
              <div
                style="display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-bottom:6px">
                <span data-i18n="subtotal">Subtotal</span><span id="qsSubtotal" class="mono">RWF 0</span></div>
              <div style="display:flex;justify-content:space-between;font-size:16px;font-weight:700;margin-bottom:16px">
                <span data-i18n="total">Total</span><span id="qsTotal" class="mono" style="color:var(--green)">RWF
                  0</span></div>
              <button class="btn btn-green" style="width:100%;justify-content:center;padding:12px"
                onclick="processQuickSale()" data-i18n="confirmSaleBtn">✓ Emeza Kugurisha — Confirm Sale</button>
              <button class="btn btn-ghost btn-sm" style="width:100%;justify-content:center;margin-top:8px"
                onclick="clearQsItems()" data-i18n="clearOrder">Clear Order</button>
            </div>
          </div>
        </div>
