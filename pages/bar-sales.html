<div class="page" id="page-bar-sales">
  <div class="page-header">
    <div>
      <div class="page-title">Bar Sales</div>
      <div class="page-sub">Drink sales from validated orders</div>
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn btn-ghost btn-sm" onclick="loadBarSales('today')" id="bsFilter-today" style="font-weight:700;border-color:var(--blue);color:var(--blue)">Today</button>
      <button class="btn btn-ghost btn-sm" onclick="loadBarSales('week')" id="bsFilter-week">This Week</button>
      <button class="btn btn-ghost btn-sm" onclick="loadBarSales('month')" id="bsFilter-month">This Month</button>
      <input type="date" class="form-input" id="bsPickDate" onchange="loadBarSales('date')" style="padding:6px 10px;font-size:12px;width:140px;max-width:100%"/>
    </div>
  </div>

  <!-- KPIs -->
  <div class="kpi-grid" style="grid-template-columns:repeat(3,minmax(0,1fr));margin-bottom:20px">
    <div style="background:var(--card);border-radius:var(--r);border:1px solid var(--border);padding:16px">
      <div style="font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;margin-bottom:6px">Total Sales</div>
      <div style="font-size:22px;font-weight:900;color:var(--blue)" id="bsKpiTotal">RWF 0</div>
    </div>
    <div style="background:var(--card);border-radius:var(--r);border:1px solid var(--border);padding:16px">
      <div style="font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;margin-bottom:6px">Items Sold</div>
      <div style="font-size:22px;font-weight:900;color:var(--green)" id="bsKpiItems">0</div>
    </div>
    <div style="background:var(--card);border-radius:var(--r);border:1px solid var(--border);padding:16px">
      <div style="font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;margin-bottom:6px">Transactions</div>
      <div style="font-size:22px;font-weight:900;color:var(--text)" id="bsKpiTx">0</div>
    </div>
  </div>

  <!-- Table -->
  <div style="background:var(--card);border-radius:var(--r);border:1px solid var(--border);overflow:hidden">
    <div class="table-wrap">
    <table style="width:100%;border-collapse:collapse">
      <thead>
        <tr style="background:var(--bg);border-bottom:2px solid var(--border)">
          <th style="padding:12px 16px;text-align:left;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase">Date</th>
          <th style="padding:12px 16px;text-align:left;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase">Item</th>
          <th style="padding:12px 16px;text-align:center;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase">Qty</th>
          <th style="padding:12px 16px;text-align:right;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase">Unit Price</th>
          <th style="padding:12px 16px;text-align:right;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase">Total</th>
          <th style="padding:12px 16px;text-align:left;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase">Sold By</th>
          <th style="padding:12px 16px;text-align:center;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase">Order</th>
        </tr>
      </thead>
      <tbody id="bsTableBody">
        <tr><td colspan="7" style="padding:40px;text-align:center;color:var(--muted)"><div class="ui-loader"><span class="ul-mark"><i></i><i></i><i></i></span><span class="ul-text">Loading…</span></div></td></tr>
      </tbody>
    </table>
    </div>
  </div>
</div>
